<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a9f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cfe3f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="36" ry="36" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="130" x2="200" y2="130" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- ── Truck body (cargo box) ── -->
  <rect x="22" y="78" width="100" height="58" rx="5" ry="5" fill="url(#truckGrad)"/>
  <!-- Cargo door line -->
  <line x1="72" y1="78" x2="72" y2="136" stroke="#2d6a9f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Cargo vent lines -->
  <line x1="30" y1="93" x2="64" y2="93" stroke="#2d6a9f" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="102" x2="64" y2="102" stroke="#2d6a9f" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="111" x2="64" y2="111" stroke="#2d6a9f" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ── Truck cab ── -->
  <path d="M122 90 L155 90 L175 108 L175 136 L122 136 Z" rx="4" fill="url(#truckGrad)"/>
  <!-- Cab roof curve -->
  <path d="M122 90 Q138 75 155 90" fill="#a8cfe8" stroke="none"/>
  <!-- Windshield -->
  <path d="M130 90 L153 90 L167 106 L130 106 Z" fill="#5b9fd4" opacity="0.7"/>
  <!-- Windshield glare -->
  <line x1="134" y1="92" x2="145" y2="103" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Side window -->
  <rect x="125" y="111" width="22" height="16" rx="2" fill="#5b9fd4" opacity="0.6"/>
  <!-- Door handle -->
  <line x1="128" y1="121" x2="133" y2="121" stroke="#1f3a5f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── Exhaust stack ── -->
  <rect x="155" y="72" width="6" height="20" rx="2" fill="#a8cfe8"/>
  <ellipse cx="158" cy="70" rx="5" ry="3" fill="#cfe3f7"/>
  <!-- Exhaust puffs -->
  <circle cx="158" cy="62" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle cx="162" cy="55" r="3" fill="rgba(255,255,255,0.15)"/>

  <!-- ── Road / ground line ── -->
  <rect x="16" y="136" width="168" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Road dashes -->
  <rect x="40" y="137" width="16" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="70" y="137" width="16" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="100" y="137" width="16" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="130" y="137" width="16" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>

  <!-- ── Wheels ── -->
  <!-- Rear axle (2 wheels) -->
  <circle cx="55" cy="140" r="14" fill="#1a2e4a"/>
  <circle cx="55" cy="140" r="9" fill="#2d6a9f"/>
  <circle cx="55" cy="140" r="4" fill="#cfe3f7"/>
  <!-- Rear second wheel -->
  <circle cx="80" cy="140" r="14" fill="#1a2e4a"/>
  <circle cx="80" cy="140" r="9" fill="#2d6a9f"/>
  <circle cx="80" cy="140" r="4" fill="#cfe3f7"/>
  <!-- Front wheel -->
  <circle cx="152" cy="140" r="14" fill="#1a2e4a"/>
  <circle cx="152" cy="140" r="9" fill="#2d6a9f"/>
  <circle cx="152" cy="140" r="4" fill="#cfe3f7"/>

  <!-- ── "W4T" text logo ── -->
  <text x="100" y="175" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800"
        fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="3">W4T</text>

  <!-- ── Small accent dots (speed lines) ── -->
  <circle cx="14" cy="100" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="8"  cy="108" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="14" cy="116" r="3" fill="rgba(255,255,255,0.3)"/>
</svg>
